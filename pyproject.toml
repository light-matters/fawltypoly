[tool.poetry]
name = "fawltypoly"
version = "0.2.0"
description = "An alternative Clojure(ish)-Blender API."
authors = ["ctw <clark.thomaswilliam@zoho.eu>"]
readme = "README.md"
packages = [{ include = "fawltypoly" }]

[tool.poetry.dependencies]
python = "^3.10"
basilisp = "^0.5.1"
basilisp-blender = "^0.5.0"
matplotlib = [
    { version = "^3.10.9", python = ">=3.10,<3.11" },
    { version = "^3.11.2", python = ">=3.11,<4.0" },
]


[build-system]
requires = ["poetry-core>=2.5.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
